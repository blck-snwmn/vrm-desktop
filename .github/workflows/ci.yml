name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run --cwd apps/electron lint
      - name: Format check
        run: bun run fmt:check
      - run: bun build --target=node apps/electron/src/main.ts --outdir /tmp/vrm-desktop-electron-main-build
      - run: bun build --target=node apps/electron/src/preload.ts --outdir /tmp/vrm-desktop-electron-preload-build
      - run: bun build --target=browser apps/electron/src/renderer.ts --outdir /tmp/vrm-desktop-electron-renderer-build

  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: bun install --frozen-lockfile
      - name: Build Tauri UI
        run: bun run --cwd apps/tauri build:ui
      - name: Check Tauri Rust
        run: cargo check --locked --manifest-path apps/tauri/src-tauri/Cargo.toml
